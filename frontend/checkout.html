<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Secure Checkout | Pixel Cart</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="site-header">
        <div class="container nav-container">
            <a class="brand-link" href="index.html">
                <div class="brand-icon">P</div>
                <span>PIXEL CART</span>
            </a>

            <nav class="nav-menu">
                <a class="nav-link" href="index.html">Home</a>
                <a class="nav-link" href="products.html">Catalog</a>
                <a class="nav-link" href="cart.html">Cart</a>
                <a class="nav-link" href="orders.html">Orders</a>
            </nav>

            <div class="nav-actions">
                <a id="nav-auth-link" class="btn btn-secondary btn-sm" href="profile.html">Profile</a>
            </div>
        </div>
    </header>

    <main class="page">
        <div class="container">
            <div class="breadcrumb">
                <a href="index.html">Home</a>
                <span>/</span>
                <a href="cart.html">Cart</a>
                <span>/</span>
                <span class="text-primary">Checkout</span>
            </div>

            <div style="margin-bottom: 2rem;">
                <span class="eyebrow">Final Step</span>
                <h1>Complete Your Order</h1>
            </div>

            <div class="checkout-grid">
                <!-- Shipping and customer info -->
                <div>
                    <form id="checkout-form" class="review-form-panel">
                        <h3 style="margin-bottom: 1.25rem;">Shipping Details</h3>

                        <div class="form-group">
                            <label class="form-label" for="checkout-name">Recipient Full Name</label>
                            <input id="checkout-name" name="name" class="form-control" placeholder="e.g. Alex Mercer" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="checkout-address">Delivery Address</label>
                            <input id="checkout-address" name="address" class="form-control" placeholder="Street address, apartment, suite..." required>
                        </div>

                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                            <div class="form-group">
                                <label class="form-label">City</label>
                                <input name="city" class="form-control" placeholder="City" value="New York">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Postal / Zip Code</label>
                                <input name="postal" class="form-control" placeholder="10001" value="10001">
                            </div>
                        </div>

                        <h3 style="margin-top: 1.5rem; margin-bottom: 1rem;">Payment Method</h3>
                        <div class="form-group">
                            <select name="payment_method" class="form-control">
                                <option value="card">Credit / Debit Card (Simulated Direct Checkout)</option>
                                <option value="cod">Cash on Delivery / Direct Digital Voucher</option>
                            </select>
                        </div>

                        <div id="checkout-alert" style="display: none;" class="alert alert-danger">
                            <span id="checkout-message"></span>
                        </div>

                        <button type="submit" id="place-order-btn" class="btn btn-primary btn-block btn-lg" style="margin-top: 1.5rem;">
                            <span>Confirm & Place Order</span>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                        </button>
                    </form>
                </div>

                <!-- Order summary preview -->
                <div>
                    <aside id="checkout-summary" class="order-summary-card">
                        <h3 style="margin-bottom: 1rem;">Order Items</h3>
                        <div id="checkout-items" style="display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 1.25rem;">
                            <p class="text-muted text-sm">Loading order preview...</p>
                        </div>
                        <div class="summary-row">
                            <span>Subtotal</span>
                            <span id="summary-subtotal" class="mono">$0.00</span>
                        </div>
                        <div class="summary-row">
                            <span>Shipping</span>
                            <span class="badge badge-success">FREE</span>
                        </div>
                        <div class="summary-row total">
                            <span>Estimated Total</span>
                            <span id="summary-total">$0.00</span>
                        </div>
                    </aside>
                </div>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <div class="footer-bottom" style="border-top: none; padding-top: 0;">
                <p>© 2026 Pixel Cart. All rights reserved.</p>
                <p class="mono text-xs text-muted">ENCRYPTED CHECKOUT TRANSACTION</p>
            </div>
        </div>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
    <script src="js/checkout.js"></script>
</body>

</html>
